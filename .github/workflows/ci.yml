name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # Tests import rag.embedder, rag.embeddings and rag.ingest_pdf, so these
        # packages must be present; no model weights or API keys are needed.
        run: pip install pytest python-dotenv numpy requests pdfplumber chromadb

      - name: Compile all modules
        run: python -m compileall -q agents api eval observability rag scrapers ui config.py

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Publish test failure summary
        if: failure()
        run: |
          msg=$(tail -n 30 pytest.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/ /g')
          echo "::error title=pytest failure::${msg}"
