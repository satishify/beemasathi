services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BEEMASATHI_TRACE: ${BEEMASATHI_TRACE:-1}
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./VM02_Embeddings_Access:/app/VM02_Embeddings_Access:ro
    restart: unless-stopped

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      BEEMASATHI_API_URL: http://api:8000
    volumes:
      - ./data:/app/data:ro
      - ./VM02_Embeddings_Access:/app/VM02_Embeddings_Access:ro
    depends_on:
      - api
    restart: unless-stopped
