[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "large"
buttonRadius = "large"
linkUnderline = false

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 16
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]

greenColor = "#15803D"
redColor = "#DC2626"
orangeColor = "#C2410C"
yellowColor = "#CA8A04"
blueColor = "#2563EB"
violetColor = "#7C3AED"
grayColor = "#64748B"

chartCategoricalColors = ["#0F766E", "#2563EB", "#7C3AED", "#EA580C", "#DC2626", "#CA8A04", "#64748B"]

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F6"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#0F766E"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
